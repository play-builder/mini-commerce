name: promote-dev-digest-to-prod

on:
  workflow_dispatch:
    inputs:
      dev_ready_run_id:
        description: Exact CI run ID that produced verified supply-chain evidence
        required: true
        type: string
      dev_ready_run_attempt:
        description: Exact CI run attempt that produced verified supply-chain evidence
        required: true
        type: string
      expected_digest:
        description: Optional dev index digest to promote; blank uses the current dev value
        required: false
        type: string

permissions: {}

jobs:
  promotion-pr:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout application scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: app

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ vars.GITOPS_OWNER }}
          repositories: ${{ vars.GITOPS_REPOSITORY_NAME }}

      - name: Checkout GitOps repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install evidence verifier dependencies
        run: npm ci --prefix app --ignore-scripts

      - name: Fetch exact CI run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.dev_ready_run_id }}
        run: |
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > evidence/workflow-run.json

      - name: Download exact verified supply-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-supply-chain-${{ inputs.dev_ready_run_id }}-${{ inputs.dev_ready_run_attempt }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.dev_ready_run_id }}

      - name: Assemble canonical DEV_READY from supply chain, deployment, and SLO
        id: dev-ready
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          node app/scripts/dev-ready-evidence.mjs assemble \
            evidence/supply-chain-evidence.json \
            gitops/evidence/dev/deployment.json gitops/evidence/dev/slo.json \
            evidence/workflow-run.json "$GITHUB_REPOSITORY" \
            gitops/envs/prod/promotion-evidence.yaml
          node app/scripts/dev-ready-evidence.mjs verify \
            gitops/envs/prod/promotion-evidence.yaml evidence/workflow-run.json "$GITHUB_REPOSITORY"
          echo "digest=$(node -p \"JSON.parse(require('fs').readFileSync('gitops/envs/prod/promotion-evidence.yaml', 'utf8')).image.indexDigest\")" >> "$GITHUB_OUTPUT"

      - name: Verify candidate differs from recorded Ch17 Prod baseline
        run: node app/scripts/dev-ready-evidence.mjs verify-baseline gitops/evidence/prod/baseline.json gitops/envs/prod/promotion-evidence.yaml

      - name: Copy the exact dev application and migration digests to prod
        id: update
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          DEV_READY_DIGEST: ${{ steps.dev-ready.outputs.digest }}
        run: |
          args=(
            promote
            gitops/envs/dev/values.yaml
            gitops/envs/prod/values.yaml
            "$DEV_READY_DIGEST"
          )
          node app/scripts/gitops-values.mjs "${args[@]}"

          if git -C gitops diff --quiet -- envs/prod/values.yaml envs/prod/promotion-evidence.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit promotion
        if: steps.update.outputs.changed == 'true'
        id: commit
        run: |
          branch="promotion/prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git -C gitops config user.name "gitops-delivery[bot]"
          git -C gitops config user.email "gitops-delivery[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add envs/prod/values.yaml envs/prod/promotion-evidence.yaml
          git -C gitops commit -m "promote(prod): verified dev application and migration digests"
          git -C gitops push origin "$branch"

      - name: Open production approval PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
        run: |
          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "promote(prod): current verified dev digest" \
            --body "CODEOWNERS approval is required. Merge starts the production Canary; this workflow never auto-merges production."
