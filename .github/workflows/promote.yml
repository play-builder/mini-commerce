name: promote-dev-digest-to-prod

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Exact CI run ID that produced verified supply-chain evidence
        required: true
        type: string
      ci_run_attempt:
        description: Exact CI run attempt that produced verified supply-chain evidence
        required: true
        type: string
      expected_digest:
        description: Optional dev index digest assertion; blank accepts the verified CI artifact value
        required: false
        type: string

permissions: {}

concurrency:
  group: production-promotion
  queue: max
  cancel-in-progress: false

jobs:
  promotion-pr:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: gitops-production
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout application scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate GitOps delivery configuration
        env:
          GITOPS_APP_ID: ${{ vars.GITOPS_APP_ID }}
          GITOPS_OWNER: ${{ vars.GITOPS_OWNER }}
          GITOPS_REPOSITORY_NAME: ${{ vars.GITOPS_REPOSITORY_NAME }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: node app/scripts/delivery-preflight.mjs gitops

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ vars.GITOPS_OWNER }}
          repositories: ${{ vars.GITOPS_REPOSITORY_NAME }}

      - name: Checkout GitOps repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Install delivery dependencies
        run: npm ci --prefix app --ignore-scripts

      - name: Fetch the selected CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT" > evidence/workflow-run.json

      - name: Download exact verified supply-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-supply-chain-${{ inputs.ci_run_id }}-${{ inputs.ci_run_attempt }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify successful main CI and image identity
        id: release
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          node app/scripts/verify-supply-chain.mjs evidence/supply-chain-evidence.json
          jq -e --slurpfile artifact evidence/supply-chain-evidence.json \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" '
            $artifact[0] as $a |
            .status == "completed" and .conclusion == "success" and
            .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and
            .path == ".github/workflows/ci.yml" and .repository.full_name == $repository and
            (.id | tostring) == $run and (.run_attempt | tostring) == $attempt and
            (.repository.id | tostring) == $a.repositoryId and .head_sha == $a.sourceSha and
            (.id | tostring) == $a.runId and .run_attempt == $a.runAttempt
          ' evidence/workflow-run.json >/dev/null
          repository=$(jq -er '.imageRepository' evidence/supply-chain-evidence.json)
          digest=$(jq -er '.imageDigest' evidence/supply-chain-evidence.json)
          [[ -z "$EXPECTED_DIGEST" || "$EXPECTED_DIGEST" == "$digest" ]] || exit 1
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Copy the exact dev application and migration digests to prod
        id: update
        env:
          RELEASE_REPOSITORY: ${{ steps.release.outputs.repository }}
          RELEASE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          node app/scripts/gitops-values.mjs promote \
            gitops/envs/dev/values.yaml gitops/envs/prod/values.yaml \
            "$RELEASE_REPOSITORY" "$RELEASE_DIGEST"
          if git -C gitops diff --quiet -- envs/prod/values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit production candidate
        if: steps.update.outputs.changed == 'true'
        id: candidate-commit
        run: |
          branch="promotion/prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git -C gitops config user.name "gitops-delivery[bot]"
          git -C gitops config user.email "gitops-delivery[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add envs/prod/values.yaml
          git -C gitops commit -m "promote(prod): verified dev application and migration digests"
          git -C gitops push origin "$branch"

      - name: Open production approval PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          VERIFIED_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}/attempts/${{ inputs.ci_run_attempt }}
          PROMOTED_IMAGE: ${{ steps.release.outputs.repository }}@${{ steps.release.outputs.digest }}
        run: |
          printf '%s\n' "CI: $VERIFIED_CI_URL" "Image: $PROMOTED_IMAGE" '' \
            'Review Dev health, traffic and metrics. CODEOWNERS approval is required.' \
            'After merge, an authorized operator must sync the approved Git SHA in Argo CD to start the production Canary. This workflow never auto-merges production.' \
            > "$RUNNER_TEMP/promotion-pr.md"
          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "${{ steps.candidate-commit.outputs.branch }}" \
            --title "promote(prod): current verified dev digest" \
            --body-file "$RUNNER_TEMP/promotion-pr.md"
