name: test

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_TEST_URL: postgresql://commerce:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/commerce
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify OpenAPI backward compatibility
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/verify-openapi-backward-compatibility.mjs
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --bootstrap-base-sha "0f6e4ce79e102054fa63c8d07b53f24dbdbb4d"
          --candidate openapi/mini-commerce.v1.yaml

      - name: Unit tests
        run: npm test

      - name: Curl loop integration test
        run: bash test/curl-loop.test.sh

      - name: Build the runtime image
        run: docker build --tag sample-app:test .
