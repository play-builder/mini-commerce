name: build-and-deploy-dev
run-name: dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dev-delivery-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_TEST_URL: postgresql://commerce:course-ci-only@127.0.0.1:5432/commerce
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: course-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout application
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run lint
          npm test

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set image repository
        id: image
        run: echo "repository=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  verify-image-index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_repository: ${{ needs.build.outputs.image_repository }}
      image_digest: ${{ needs.build.outputs.image_digest }}
    steps:
      - name: Checkout image verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify immutable multi-architecture image index
        run: bash scripts/verify-image-index.sh "${{ needs.build.outputs.image_repository }}" "${{ needs.build.outputs.image_digest }}"

  update-dev-gitops:
    needs: verify-image-index
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout application scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: app

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ vars.GITOPS_OWNER }}
          repositories: ${{ vars.GITOPS_REPOSITORY_NAME }}

      - name: Checkout GitOps repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update dev application and migration image digests
        id: update
        run: |
          node app/scripts/gitops-values.mjs set \
            gitops/envs/dev/values.yaml \
            "${{ needs.verify-image-index.outputs.image_repository }}" \
            "${{ needs.verify-image-index.outputs.image_digest }}"

          if git -C gitops diff --quiet -- envs/dev/values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the delivery digest change
        if: steps.update.outputs.changed == 'true'
        id: commit
        run: |
          branch="automation/dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git -C gitops config user.name "gitops-delivery[bot]"
          git -C gitops config user.email "gitops-delivery[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add envs/dev/values.yaml
          git -C gitops commit -m "deploy(dev): ${GITHUB_SHA} application and migration digests"
          git -C gitops push origin "$branch"

      - name: Open and auto-merge the dev GitOps PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
        run: |
          pr_url=$(gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "deploy(dev): ${{ github.sha }}" \
            --body "Multi-arch image index: ${{ needs.verify-image-index.outputs.image_repository }}@${{ needs.verify-image-index.outputs.image_digest }}")
          gh pr merge "$pr_url" --auto --squash --delete-branch
          bash app/scripts/wait-pr-terminal-state.sh "$pr_url" "$GH_REPO"
